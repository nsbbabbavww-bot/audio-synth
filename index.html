<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Synth & Sequencer</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #222;
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --neon-green: #00ff00;
            --text-color: #eee;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .container {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border: 1px solid #333;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .controls-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .panel {
            background: #111;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            flex: 1;
        }

        .panel h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .control-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .control-group label {
            width: 80px;
            font-size: 0.9rem;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: #333;
            height: 5px;
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--neon-blue);
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-blue);
        }

        input[type="range"]:active::-webkit-slider-thumb {
            background: var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink);
        }

        select {
            background: #333;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 5px;
            border-radius: 4px;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        .sequencer-section {
            margin-top: 20px;
        }

        .track {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .track-label {
            width: 80px;
            font-weight: bold;
            color: var(--text-color);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .grid {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .step {
            width: 30px;
            height: 30px;
            background-color: #333;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #222;
            transition: all 0.1s ease;
        }

        /* Track Specific Colors */
        .track:nth-child(1) .step.active {
            background-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
            border-color: var(--neon-pink);
        }
        .track:nth-child(2) .step.active {
            background-color: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
            border-color: var(--neon-green);
        }
        .track:nth-child(3) .step.active {
            background-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            border-color: var(--neon-blue);
        }

        .step.current {
            border-color: #fff;
            box-shadow: 0 0 5px #fff, inset 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .transport {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            background: #111;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 10px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
            transition: all 0.2s;
        }

        button:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        button.active {
            background: var(--neon-pink);
            color: #000;
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink);
        }

        .bpm-display {
            display: inline-block;
            width: 40px;
            text-align: right;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Neon Sequencer</h1>

        <div class="controls-section">
            <div class="panel">
                <h2>Transport</h2>
                <div class="control-group">
                    <button id="playBtn">Play</button>
                </div>
                <div class="control-group" style="margin-top: 15px;">
                    <label>BPM: <span id="bpmValue" class="bpm-display">120</span></label>
                    <input type="range" id="bpm" min="60" max="200" value="120">
                </div>
            </div>

            <div class="panel">
                <h2>Bass Synth</h2>
                <div class="control-group">
                    <label>Wave:</label>
                    <select id="waveform">
                        <option value="sawtooth">Sawtooth</option>
                        <option value="square">Square</option>
                        <option value="sine">Sine</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Attack:</label>
                    <input type="range" id="attack" min="0.01" max="1" step="0.01" value="0.05">
                </div>
                <div class="control-group">
                    <label>Decay:</label>
                    <input type="range" id="decay" min="0.01" max="1" step="0.01" value="0.2">
                </div>
                <div class="control-group">
                    <label>Sustain:</label>
                    <input type="range" id="sustain" min="0" max="1" step="0.01" value="0.5">
                </div>
                <div class="control-group">
                    <label>Release:</label>
                    <input type="range" id="release" min="0.01" max="2" step="0.01" value="0.5">
                </div>
            </div>
        </div>

        <div class="sequencer-section">
            <div class="track" id="track-kick">
                <div class="track-label" style="color: var(--neon-pink)">Kick</div>
                <div class="grid"></div>
            </div>
            <div class="track" id="track-snare">
                <div class="track-label" style="color: var(--neon-green)">Snare</div>
                <div class="grid"></div>
            </div>
            <div class="track" id="track-bass">
                <div class="track-label" style="color: var(--neon-blue)">Bass</div>
                <div class="grid"></div>
            </div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        let isPlaying = false;
        let currentStep = 0;
        let nextNoteTime = 0;
        let timerID;
        const lookahead = 25.0; // ms
        const scheduleAheadTime = 0.1; // s

        // Sequencer state
        const numSteps = 16;
        const tracks = {
            kick: new Array(numSteps).fill(false),
            snare: new Array(numSteps).fill(false),
            bass: new Array(numSteps).fill(false)
        };

        // Initialize UI Grid
        ['kick', 'snare', 'bass'].forEach(trackName => {
            const grid = document.querySelector(`#track-${trackName} .grid`);
            for (let i = 0; i < numSteps; i++) {
                const step = document.createElement('div');
                step.classList.add('step');
                step.dataset.track = trackName;
                step.dataset.step = i;
                // Add some default pattern
                if (trackName === 'kick' && (i % 4 === 0)) { step.classList.add('active'); tracks[trackName][i] = true; }
                if (trackName === 'snare' && (i % 8 === 4)) { step.classList.add('active'); tracks[trackName][i] = true; }
                if (trackName === 'bass' && (i % 3 === 0 || i % 8 === 7)) { step.classList.add('active'); tracks[trackName][i] = true; }

                step.addEventListener('click', () => {
                    step.classList.toggle('active');
                    tracks[trackName][i] = step.classList.contains('active');
                });
                grid.appendChild(step);
            }
        });

        // UI Controls
        const playBtn = document.getElementById('playBtn');
        const bpmSlider = document.getElementById('bpm');
        const bpmValue = document.getElementById('bpmValue');

        bpmSlider.addEventListener('input', (e) => {
            bpmValue.textContent = e.target.value;
        });

        playBtn.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = 'Stop';
                playBtn.classList.add('active');
                currentStep = 0;
                nextNoteTime = audioCtx.currentTime + 0.05;
                scheduler();
            } else {
                playBtn.textContent = 'Play';
                playBtn.classList.remove('active');
                clearTimeout(timerID);
                updateStepUI(-1);
            }
        });

        function nextNote() {
            const secondsPerBeat = 60.0 / bpmSlider.value;
            // 16th notes
            nextNoteTime += 0.25 * secondsPerBeat;
            currentStep = (currentStep + 1) % numSteps;
        }

        function scheduleNote(stepNumber, time) {
            // Update UI (defer to main thread)
            requestAnimationFrame(() => updateStepUI(stepNumber));

            if (tracks.kick[stepNumber]) playKick(time);
            if (tracks.snare[stepNumber]) playSnare(time);
            if (tracks.bass[stepNumber]) playBass(time, stepNumber);
        }

        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                scheduleNote(currentStep, nextNoteTime);
                nextNote();
            }
            timerID = setTimeout(scheduler, lookahead);
        }

        function updateStepUI(stepNumber) {
            document.querySelectorAll('.step.current').forEach(el => el.classList.remove('current'));
            if (stepNumber !== -1) {
                document.querySelectorAll(`.step[data-step="${stepNumber}"]`).forEach(el => el.classList.add('current'));
            }
        }

        // Instruments
        function playKick(time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.frequency.setValueAtTime(150, time);
            osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);

            gain.gain.setValueAtTime(1, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);

            osc.start(time);
            osc.stop(time + 0.5);
        }

        function playSnare(time) {
            // Noise
            const bufferSize = audioCtx.sampleRate * 0.2; // 0.2 seconds
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'highpass';
            noiseFilter.frequency.value = 1000;

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(1, time);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            // Snap
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'triangle';

            osc.frequency.setValueAtTime(250, time);
            oscGain.gain.setValueAtTime(0.7, time);
            oscGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);

            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);

            noise.start(time);
            osc.start(time);
            osc.stop(time + 0.2);
        }

        function playBass(time, stepNumber) {
            const waveform = document.getElementById('waveform').value;
            const a = parseFloat(document.getElementById('attack').value);
            const d = parseFloat(document.getElementById('decay').value);
            const s = parseFloat(document.getElementById('sustain').value);
            const r = parseFloat(document.getElementById('release').value);

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = waveform;

            // Notes for a simple bassline (C minor pentatonic scale roughly)
            const notes = [32.7, 36.7, 38.9, 43.6, 49.0, 55.0, 58.3, 65.4];
            // Randomize pitch slightly based on step for a groovier feel, or keep it fixed
            const noteIdx = (stepNumber * 3) % notes.length;
            osc.frequency.setValueAtTime(notes[noteIdx], time);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, time);
            filter.frequency.exponentialRampToValueAtTime(100, time + d); // filter envelope

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            // ADSR Envelope
            const noteLength = (60.0 / bpmSlider.value) * 0.25; // 16th note length
            const holdTime = Math.max(0, noteLength - a - r); // adjust sustain time

            gain.gain.setValueAtTime(0, time);
            // Attack
            gain.gain.linearRampToValueAtTime(0.8, time + a);
            // Decay
            gain.gain.linearRampToValueAtTime(s * 0.8, time + a + d);
            // Sustain (hold)
            gain.gain.setValueAtTime(s * 0.8, time + a + d + holdTime);
            // Release
            gain.gain.linearRampToValueAtTime(0, time + a + d + holdTime + r);

            osc.start(time);
            osc.stop(time + a + d + holdTime + r + 0.1);
        }
    </script>
</body>
</html>
